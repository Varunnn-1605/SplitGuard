[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitguard"
dynamic = ["version"]
description = "Evidence-driven audit engine for ML data leakage and train/test contamination."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.1,<3",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.37,<2",
]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
splitguard = "splitguard.cli:main"
splitguard-ui = "splitguard.ui_launcher:main"

[tool.setuptools.dynamic]
version = { attr = "splitguard._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
addopts = "-q"
filterwarnings = [
    "error::FutureWarning",
    "error::pandas.errors.PerformanceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "validation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
